name: Daily Stock Report

on:
  schedule:
    # 台灣時間週一到週五下午 15:30 執行 (對應 UTC 07:30)
    - cron: '30 7 * * 1-5'
  
  # 讓妳可以隨時手動按按鈕測試
  workflow_dispatch:

jobs:
  run-stock-bot:
    runs-on: ubuntu-latest
    steps:
      - name: 載入程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝需要的套件
        run: |
          pip install yfinance pandas

      - name: 執行股票抓取與寄信程式
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
        run: |
          python main.py
